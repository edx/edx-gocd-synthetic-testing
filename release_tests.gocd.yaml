format_version: 10
pipelines:
  release_tests_pipeline:
    group: stage-frontend-app-course-authoring
    label_template: ${COUNT}
    lock_behavior: none
    display_order: -1
    materials:
      upstream:
        pipeline: stage-frontend-app-course-authoring
        stage: stage_frontend-app-course-authoring_deploy_frontend
      git-1eda989:
        git: https://github.com/edx/edx-gocd-synthetic-testing.git
        type: configrepo
        shallow_clone: false
        auto_update: true
        branch: bszabo/frontend-app-authoring-pipeline-testing
        destination: synthetic-testing
      tubular:
        git: https://github.com/edx/tubular
        blacklist:
          - '**/*'
        shallow_clone: true
        auto_update: true
        branch: bszabo/frontend-app-authoring-pipeline-testing
        destination: tubular
    environment_variables:
      DATADOG_APP_KEY: "{{SECRET:[gocd-pipelines-sre-managed][DATADOG_APP_KEY]}}"
      DATADOG_API_KEY: "{{SECRET:[gocd-pipelines-sre-managed][DATADOG_API_KEY]}}"
    stages:
    - release_tests_stage:
        fetch_materials: true
        keep_artifacts: false
        clean_workspace: false
        approval:
          type: success
          allow_only_on_success: true
        jobs:
          run_release_tests_job:
            timeout: 0
            elastic_profile_id: legacy-default
            tasks:
            - exec:
                arguments:
                - ./tubular/scripts/dd_synthetic_tests.py
                - '--enable-automated-rollbacks'
                command: python3
                working_directory: tubular
                run_if: passed
